<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCraft 3D → Блоки</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'MultiCraftFont';
            src: url('fonts/MultiCraftFont.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --border: #262626;
            --border-active: #00ff41;
            --accent: #00ff41;
            --text: #ffffff;
            --text-dim: #777777;
            --font-main: 'MultiCraftFont', 'Press Start 2P', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-size: 11px;
            line-height: 1.5;
            padding: 16px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (max-width: 850px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel);
            border: 2px solid var(--border);
            padding: 14px;
            margin-bottom: 14px;
        }

        .panel-title {
            font-size: 10px;
            color: var(--accent);
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            color: var(--text-dim);
            font-size: 9px;
            margin-bottom: 6px;
        }

        select, input[type="file"], button {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            font-size: 9px;
            outline: none;
        }

        select:focus, button:hover {
            border-color: var(--border-active);
        }

        .slider-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            font-size: 9px;
            margin-bottom: 4px;
        }

        .val-tag {
            color: var(--accent);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            cursor: pointer;
        }

        button.btn-main {
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            cursor: pointer;
            padding: 10px;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        button.btn-main:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .viewport-box {
            position: relative;
            height: 480px;
            background: #000;
            border: 2px solid var(--border);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .viewport-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .stat-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
        }

        .stat-val {
            color: var(--accent);
            margin-top: 4px;
        }

        .cmd-out {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            color: var(--text-dim);
            font-size: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .part-selector {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0;
        }

        .part-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 10px;
            font-size: 8px;
            cursor: pointer;
        }

        .part-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .toast {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            font-size: 9px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 1000;
        }

        .toast.show { opacity: 1; }
        .toast.err { border-color: #ff3333; color: #ff3333; }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg);
            border: 1px solid var(--border);
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.1s;
        }
    </style>
</head>
<body>

    <header>
        <h1>MULTICRAFT 3D → БЛОКИ</h1>
    </header>

    <div class="layout">
        <!-- Левая панель: Параметры -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">1. Загрузка модели</div>
                <div class="field">
                    <label>Форматы: OBJ, GLB, GLTF, STL</label>
                    <input type="file" id="modelFile" accept=".obj,.glb,.gltf,.stl">
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">2. Настройки вокселизации</div>
                
                <div class="field">
                    <div class="slider-row">
                        <span>Детализация:</span>
                        <span id="resVal" class="val-tag">0.5</span>
                    </div>
                    <input type="range" id="resolution" min="0.05" max="1.0" step="0.05" value="0.5">
                </div>

                <div class="field">
                    <div class="slider-row">
                        <span>Масштаб:</span>
                        <span id="scaleVal" class="val-tag">1x</span>
                    </div>
                    <input type="range" id="scale" min="1" max="5" step="1" value="1">
                </div>

                <div class="field">
                    <label>Режим команд:</label>
                    <select id="cmdMode">
                        <option value="short">Быстрые (/shift, /s)</option>
                        <option value="standard">Стандартные (//pos, //set)</option>
                    </select>
                </div>

                <button class="btn-main" id="processBtn">🔨 Обработать модель</button>
            </div>
        </div>

        <!-- Правая панель: Просмотр и Результат -->
        <div class="main-content">
            <div class="panel">
                <div class="panel-title">3D-предпросмотр</div>
                <div class="viewport-box">
                    <canvas id="canvas3d"></canvas>
                </div>
                
                <div class="viewport-controls">
                    <button class="btn-main" id="toggleOrigBtn">Оригинал</button>
                    <button class="btn-main" id="toggleVoxBtn">Блоки</button>
                    <button class="btn-main" id="resetCamBtn">Сброс</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Статистика</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <label>Всего блоков</label>
                        <div class="stat-val" id="statCount">0</div>
                    </div>
                    <div class="stat-item">
                        <label>Размер X</label>
                        <div class="stat-val" id="statX">0</div>
                    </div>
                    <div class="stat-item">
                        <label>Размер Y</label>
                        <div class="stat-val" id="statY">0</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Команды WorldEdit</div>
                <div class="part-selector" id="partSelector"></div>
                <div class="cmd-out" id="cmdOutput">Загрузите модель и нажмите Обработать</div>
                <div class="viewport-controls" style="margin-top: 8px;">
                    <button class="btn-main" id="copyBtn">📋 Скопировать всё</button>
                    <button class="btn-main" id="downloadBtn">💾 Скачать .txt</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

    <script>
    // ================================================================
    // 1. ПОЛНАЯ ПАЛИТРА БЛОКОВ MULTICRAFT
    // ================================================================
    const PALETTE = [
        // === БЕТОН (concrete) — все 16 цветов ===
        { id: 'concrete:concrete_white', rgb: [207, 213, 214], cat: 'concrete' },
        { id: 'concrete:concrete_grey', rgb: [125, 125, 115], cat: 'concrete' },
        { id: 'concrete:concrete_dark_grey', rgb: [55, 58, 62], cat: 'concrete' },
        { id: 'concrete:concrete_black', rgb: [8, 10, 15], cat: 'concrete' },
        { id: 'concrete:concrete_violet', rgb: [100, 32, 156], cat: 'concrete' },
        { id: 'concrete:concrete_blue', rgb: [45, 47, 143], cat: 'concrete' },
        { id: 'concrete:concrete_cyan', rgb: [21, 119, 136], cat: 'concrete' },
        { id: 'concrete:concrete_dark_green', rgb: [73, 91, 36], cat: 'concrete' },
        { id: 'concrete:concrete_green', rgb: [94, 169, 25], cat: 'concrete' },
        { id: 'concrete:concrete_yellow', rgb: [241, 175, 21], cat: 'concrete' },
        { id: 'concrete:concrete_brown', rgb: [96, 60, 32], cat: 'concrete' },
        { id: 'concrete:concrete_orange', rgb: [224, 97, 1], cat: 'concrete' },
        { id: 'concrete:concrete_red', rgb: [142, 33, 33], cat: 'concrete' },
        { id: 'concrete:concrete_magenta', rgb: [169, 48, 159], cat: 'concrete' },
        { id: 'concrete:concrete_pink', rgb: [214, 101, 143], cat: 'concrete' },

        // === ШЕРСТЬ (wool) — все 15 цветов ===
        { id: 'wool:white', rgb: [234, 236, 237], cat: 'wool' },
        { id: 'wool:grey', rgb: [142, 142, 135], cat: 'wool' },
        { id: 'wool:dark_grey', rgb: [63, 68, 72], cat: 'wool' },
        { id: 'wool:black', rgb: [21, 21, 26], cat: 'wool' },
        { id: 'wool:violet', rgb: [122, 42, 173], cat: 'wool' },
        { id: 'wool:blue', rgb: [53, 57, 157], cat: 'wool' },
        { id: 'wool:cyan', rgb: [21, 138, 145], cat: 'wool' },
        { id: 'wool:dark_green', rgb: [85, 110, 28], cat: 'wool' },
        { id: 'wool:green', rgb: [112, 185, 26], cat: 'wool' },
        { id: 'wool:yellow', rgb: [249, 198, 40], cat: 'wool' },
        { id: 'wool:brown', rgb: [114, 72, 41], cat: 'wool' },
        { id: 'wool:orange', rgb: [241, 118, 20], cat: 'wool' },
        { id: 'wool:red', rgb: [161, 39, 35], cat: 'wool' },
        { id: 'wool:magenta', rgb: [190, 69, 180], cat: 'wool' },
        { id: 'wool:pink', rgb: [238, 141, 172], cat: 'wool' },

        // === ОБОЖЖЁННАЯ ГЛИНА (hardened_clay) ===
        { id: 'hardened_clay:white', rgb: [210, 178, 161], cat: 'clay' },
        { id: 'hardened_clay:grey', rgb: [135, 107, 98], cat: 'clay' },
        { id: 'hardened_clay:dark_grey', rgb: [58, 42, 36], cat: 'clay' },
        { id: 'hardened_clay:black', rgb: [37, 23, 16], cat: 'clay' },
        { id: 'hardened_clay:violet', rgb: [118, 70, 86], cat: 'clay' },
        { id: 'hardened_clay:blue', rgb: [74, 60, 91], cat: 'clay' },
        { id: 'hardened_clay:cyan', rgb: [87, 91, 91], cat: 'clay' },
        { id: 'hardened_clay:dark_green', rgb: [76, 83, 42], cat: 'clay' },
        { id: 'hardened_clay:green', rgb: [104, 118, 53], cat: 'clay' },
        { id: 'hardened_clay:yellow', rgb: [186, 133, 35], cat: 'clay' },
        { id: 'hardened_clay:brown', rgb: [77, 51, 36], cat: 'clay' },
        { id: 'hardened_clay:orange', rgb: [162, 84, 38], cat: 'clay' },
        { id: 'hardened_clay:red', rgb: [143, 61, 47], cat: 'clay' },
        { id: 'hardened_clay:magenta', rgb: [150, 88, 109], cat: 'clay' },
        { id: 'hardened_clay:pink', rgb: [162, 78, 79], cat: 'clay' },

        // === КАМЕНЬ (default) ===
        { id: 'default:stone', rgb: [128, 128, 128], cat: 'stone' },
        { id: 'default:cobble', rgb: [100, 100, 100], cat: 'stone' },
        { id: 'default:brick', rgb: [160, 70, 50], cat: 'stone' },
        { id: 'default:sandstone', rgb: [220, 200, 140], cat: 'stone' },
        { id: 'default:desert_stone', rgb: [150, 100, 60], cat: 'stone' },

        // === ДЕРЕВО ===
        { id: 'default:wood', rgb: [160, 120, 80], cat: 'wood' },
        { id: 'default:pine_wood', rgb: [140, 100, 60], cat: 'wood' },
        { id: 'default:jungle_wood', rgb: [180, 100, 50], cat: 'wood' },

        // === СТУПЕНЬКИ (плиты) ===
        { id: 'stairs:slab_stone', rgb: [128, 128, 128], cat: 'stone', shape: 'cut' },
        { id: 'stairs:slab_cobble', rgb: [100, 100, 100], cat: 'stone', shape: 'cut' },
        { id: 'stairs:slab_brick', rgb: [160, 70, 50], cat: 'stone', shape: 'cut' },
        { id: 'stairs:slab_wood', rgb: [160, 120, 80], cat: 'wood', shape: 'cut' },
    ];

    // ================================================================
    // 2. LAB-ЦВЕТОВОЕ ПРОСТРАНСТВО (для точного подбора)
    // ================================================================
    function srgbToLinear(c) { c = c/255; return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
    function rgbToXyz(r,g,b) {
        const rl=srgbToLinear(r), gl=srgbToLinear(g), bl=srgbToLinear(b);
        return [
            rl*0.4124564+gl*0.3575761+bl*0.1804375,
            rl*0.2126729+gl*0.7151522+bl*0.0721750,
            rl*0.0193339+gl*0.1191920+bl*0.9503041
        ];
    }
    function xyzToLab(x,y,z) {
        const Xn=0.95047, Yn=1.0, Zn=1.08883;
        function f(t){ return t>0.008856 ? Math.cbrt(t) : (7.787*t+16/116); }
        const fx=f(x/Xn), fy=f(y/Yn), fz=f(z/Zn);
        return [ (116*fy)-16, 500*(fx-fy), 200*(fy-fz) ];
    }
    function rgbToLab(r,g,b){ const [x,y,z]=rgbToXyz(r,g,b); return xyzToLab(x,y,z); }

    // ================================================================
    // 3. ПОДБОР БЛИЖАЙШЕГО БЛОКА
    // ================================================================
    function getNearestBlock(r, g, b, shapeFilter) {
        // Если форма блоков = "full" — используем только цельные блоки
        const filtered = PALETTE.filter(item => {
            if (shapeFilter === 'full') return !item.shape || item.shape === 'full';
            return true; // все блоки
        });

        const [L, a, bb] = rgbToLab(r, g, b);
        let bestMatch = 'default:stone';
        let minDiff = Infinity;

        for (const block of filtered) {
            const [bL, ba, bbb] = rgbToLab(block.rgb[0], block.rgb[1], block.rgb[2]);
            const dL = L - bL, da = a - ba, db = bb - bbb;
            const diff = dL*dL + da*da + db*db;
            if (diff < minDiff) {
                minDiff = diff;
                bestMatch = block.id;
            }
        }
        return bestMatch;
    }

    // ================================================================
    // 4. ОСНОВНАЯ ЛОГИКА
    // ================================================================
    let scene, camera, renderer, controls;
    let loadedMesh = null, voxMesh = null;
    let convertedVoxels = [];
    let allCommandParts = [];
    let currentPartIndex = 0;

    function init3D() {
        const canvas = document.getElementById('canvas3d');
        const box = canvas.parentElement;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 1000);
        camera.position.set(4, 4, 6);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(box.clientWidth, box.clientHeight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Добавляем оси для ориентира
        const axesHelper = new THREE.AxesHelper(2);
        scene.add(axesHelper);

        function loop() {
            requestAnimationFrame(loop);
            controls.update();
            renderer.render(scene, camera);
        }
        loop();
    }

    function loadFile(file) {
        if (!file) return;
        showToast('Загрузка файла...');

        const url = URL.createObjectURL(file);
        const ext = file.name.split('.').pop().toLowerCase();

        const onSuccess = (obj) => {
            URL.revokeObjectURL(url);
            setupSceneModel(obj);
            showToast('Файл загружен');
        };

        const onError = (err) => {
            URL.revokeObjectURL(url);
            showToast('Ошибка загрузки', true);
            console.error(err);
        };

        if (ext === 'obj') new THREE.OBJLoader().load(url, onSuccess, null, onError);
        else if (ext === 'glb' || ext === 'gltf') new THREE.GLTFLoader().load(url, g => onSuccess(g.scene), null, onError);
        else if (ext === 'stl') new THREE.STLLoader().load(url, geom => {
            geom.center();
            const mat = new THREE.MeshStandardMaterial({ color: 0x888888, flatShading: true });
            onSuccess(new THREE.Mesh(geom, mat));
        }, null, onError);
        else showToast('Неподдерживаемый формат', true);
    }

    function setupSceneModel(model) {
        if (loadedMesh) { scene.remove(loadedMesh); loadedMesh = null; }
        if (voxMesh) { scene.remove(voxMesh); voxMesh = null; }

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) model.scale.multiplyScalar(3 / maxDim);

        loadedMesh = model;
        scene.add(loadedMesh);

        camera.position.set(4, 4, 6);
        controls.target.set(0, 0, 0);
        controls.update();
    }

    function processVoxelization() {
        if (!loadedMesh) {
            showToast('Сначала загрузите модель!', true);
            return;
        }

        const step = parseFloat(document.getElementById('resolution').value);
        const scale = parseInt(document.getElementById('scale').value);
        const shape = document.getElementById('cmdMode').value;
        const shapeFilter = (shape === 'short') ? 'full' : 'all';

        const progressFill = document.getElementById('progressFill');
        progressFill.style.width = '0%';

        const voxelMap = new Map();
        let processed = 0;
        let total = 0;

        // Сначала считаем общее количество вершин
        loadedMesh.traverse((child) => {
            if (child.isMesh && child.geometry && child.geometry.attributes.position) {
                total += child.geometry.attributes.position.count;
            }
        });

        if (total === 0) { showToast('Нет данных для обработки', true); return; }

        // Обрабатываем модель
        loadedMesh.traverse((child) => {
            if (child.isMesh && child.geometry) {
                const pos = child.geometry.attributes.position;
                const col = child.geometry.attributes.color;
                const idx = child.geometry.index;

                let positions = pos.array;
                let colors = col ? col.array : null;

                // Если есть индексы — используем их
                if (idx) {
                    const indices = idx.array;
                    const newPos = [];
                    const newCol = [];
                    for (let i = 0; i < indices.length; i++) {
                        const pi = indices[i] * 3;
                        newPos.push(pos.array[pi], pos.array[pi+1], pos.array[pi+2]);
                        if (colors) {
                            const ci = indices[i] * 3;
                            newCol.push(colors[ci], colors[ci+1], colors[ci+2]);
                        }
                    }
                    positions = new Float32Array(newPos);
                    colors = newCol.length ? new Float32Array(newCol) : null;
                }

                // Для каждой вершины
                for (let i = 0; i < positions.length; i += 3) {
                    let r = 128, g = 128, b = 128;
                    if (colors) {
                        r = Math.round(colors[i] * 255);
                        g = Math.round(colors[i+1] * 255);
                        b = Math.round(colors[i+2] * 255);
                    } else if (child.material && child.material.color) {
                        r = Math.round(child.material.color.r * 255);
                        g = Math.round(child.material.color.g * 255);
                        b = Math.round(child.material.color.b * 255);
                    }

                    const x = Math.round((positions[i] * scale) / step);
                    const y = Math.round((positions[i+1] * scale) / step);
                    const z = Math.round((positions[i+2] * scale) / step);

                    const key = `${x},${y},${z}`;
                    if (!voxelMap.has(key)) {
                        const blockId = getNearestBlock(r, g, b, shapeFilter);
                        voxelMap.set(key, { x, y, z, blockId });
                    }

                    processed++;
                    if (processed % 1000 === 0) {
                        progressFill.style.width = Math.min(100, (processed / total) * 100) + '%';
                    }
                }
            }
        });

        progressFill.style.width = '100%';

        convertedVoxels = Array.from(voxelMap.values());

        // Ограничение на 100 000 блоков
        if (convertedVoxels.length > 100000) {
            showToast('⚠️ Слишком много блоков! Увеличьте детализацию.', true);
            convertedVoxels = convertedVoxels.slice(0, 100000);
        }

        renderVoxelPreview(convertedVoxels);
        generateCommands();

        // Статистика
        document.getElementById('statCount').textContent = convertedVoxels.length;
        if (convertedVoxels.length > 0) {
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            convertedVoxels.forEach(v => {
                if (v.x < minX) minX = v.x;
                if (v.x > maxX) maxX = v.x;
                if (v.y < minY) minY = v.y;
                if (v.y > maxY) maxY = v.y;
            });
            document.getElementById('statX').textContent = maxX - minX + 1;
            document.getElementById('statY').textContent = maxY - minY + 1;
        }

        showToast(`✅ Конвертация завершена! Блоков: ${convertedVoxels.length}`);
    }

    function renderVoxelPreview(voxels) {
        if (voxMesh) { scene.remove(voxMesh); voxMesh = null; }

        if (!voxels.length) return;

        // Создаём кубы для каждого вокселя (упрощённо — используем InstancedMesh)
        const geometry = new THREE.BoxGeometry(0.07, 0.07, 0.07);
        const material = new THREE.MeshStandardMaterial({
            color: 0x00ff41,
            emissive: 0x00ff41,
            emissiveIntensity: 0.1,
            transparent: true,
            opacity: 0.8,
        });

        const dummy = new THREE.Object3D();
        const count = Math.min(voxels.length, 50000); // Ограничение для производительности
        const mesh = new THREE.InstancedMesh(geometry, material, count);

        for (let i = 0; i < count; i++) {
            const v = voxels[i];
            dummy.position.set(v.x * 0.08, v.y * 0.08, v.z * 0.08);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);
        }

        mesh.instanceMatrix.needsUpdate = true;
        voxMesh = mesh;
        scene.add(voxMesh);
    }

    function generateCommands() {
        if (!convertedVoxels.length) return;

        const mode = document.getElementById('cmdMode').value;
        let lines = [];

        if (mode === 'short') {
            lines.push('/1');
            let cx = 0, cy = 0, cz = 0;
            // Сортируем для оптимального пути
            const sorted = [...convertedVoxels].sort((a, b) => {
                if (a.y !== b.y) return a.y - b.y;
                if (a.z !== b.z) return a.z - b.z;
                return a.x - b.x;
            });

            for (const v of sorted) {
                if (v.x !== cx) { lines.push(`/shift x ${v.x - cx}`); cx = v.x; }
                if (v.y !== cy) { lines.push(`/shift y ${v.y - cy}`); cy = v.y; }
                if (v.z !== cz) { lines.push(`/shift z ${v.z - cz}`); cz = v.z; }
                lines.push(`/s ${v.blockId}`);
            }
        } else {
            for (const v of convertedVoxels) {
                lines.push(`//pos1 ${v.x},${v.y},${v.z}`);
                lines.push(`//pos2 ${v.x},${v.y},${v.z}`);
                lines.push(`//set ${v.blockId}`);
            }
        }

        // Разбиваем на части по 30 000 строк
        const PART_SIZE = 30000;
        allCommandParts = [];
        for (let i = 0; i < lines.length; i += PART_SIZE) {
            allCommandParts.push(lines.slice(i, i + PART_SIZE));
        }

        currentPartIndex = 0;
        renderPartSelector();
        showPart(0);
    }

    function renderPartSelector() {
        const container = document.getElementById('partSelector');
        container.innerHTML = '';
        
        if (allCommandParts.length <= 1) {
            container.innerHTML = '<span style="color: var(--text-dim); font-size: 8px;">1 часть (все команды)</span>';
            return;
        }

        allCommandParts.forEach((part, i) => {
            const btn = document.createElement('button');
            btn.className = 'part-btn' + (i === currentPartIndex ? ' active' : '');
            btn.textContent = `${i+1} часть (${part.length})`;
            btn.onclick = () => { currentPartIndex = i; showPart(i); };
            container.appendChild(btn);
        });
    }

    function showPart(index) {
        if (!allCommandParts.length) return;
        const part = allCommandParts[index] || [];
        document.getElementById('cmdOutput').textContent = part.join('\n');
        
        // Обновляем активную кнопку
        document.querySelectorAll('.part-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
    }

    // ================================================================
    // 5. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ================================================================
    function showToast(text, isErr) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.toggle('err', !!isErr);
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ================================================================
    // 6. СОБЫТИЯ
    // ================================================================
    document.getElementById('resolution').addEventListener('input', e => 
        document.getElementById('resVal').textContent = e.target.value
    );
    document.getElementById('scale').addEventListener('input', e => 
        document.getElementById('scaleVal').textContent = e.target.value + 'x'
    );

    document.getElementById('modelFile').addEventListener('change', e => {
        loadFile(e.target.files[0]);
        e.target.value = '';
    });

    document.getElementById('processBtn').addEventListener('click', processVoxelization);

    document.getElementById('toggleOrigBtn').addEventListener('click', () => {
        if (loadedMesh) loadedMesh.visible = !loadedMesh.visible;
    });

    document.getElementById('toggleVoxBtn').addEventListener('click', () => {
        if (voxMesh) voxMesh.visible = !voxMesh.visible;
    });

    document.getElementById('resetCamBtn').addEventListener('click', () => {
        camera.position.set(4, 4, 6);
        controls.target.set(0, 0, 0);
        controls.update();
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const txt = document.getElementById('cmdOutput').textContent;
        if (!txt || txt === 'Загрузите модель и нажмите Обработать') {
            showToast('Нет команд для копирования', true);
            return;
        }
        navigator.clipboard.writeText(txt).then(() => showToast('📋 Скопировано!'));
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const txt = document.getElementById('cmdOutput').textContent;
        if (!txt || txt === 'Загрузите модель и нажмите Обработать') {
            showToast('Нет команд для скачивания', true);
            return;
        }
        const blob = new Blob([txt], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'multicraft_build.txt';
        a.click();
        showToast('💾 Скачано!');
    });

    // ================================================================
    // 7. ЗАПУСК
    // ================================================================
    window.addEventListener('DOMContentLoaded', init3D);
    </script>
</body>
</html>
