<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCraft 3D Converter</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --border: #262626;
            --border-active: #00ff41;
            --accent: #00ff41;
            --text: #ffffff;
            --text-dim: #888888;
            --font-main: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-size: 10px;
            line-height: 1.5;
            padding: 16px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 14px;
            color: var(--accent);
            text-shadow: 2px 2px #000;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (max-width: 850px) {
            .layout { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel);
            border: 2px solid var(--border);
            padding: 12px;
            margin-bottom: 12px;
        }

        .panel-title {
            font-size: 9px;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .field { margin-bottom: 10px; }

        label {
            display: block;
            color: var(--text-dim);
            font-size: 8px;
            margin-bottom: 4px;
        }

        select, input[type="file"], button {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            font-size: 8px;
            outline: none;
        }

        select:focus, button:hover { border-color: var(--border-active); }

        .slider-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            font-size: 8px;
            margin-bottom: 4px;
        }

        .val-tag { color: var(--accent); }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent);
            cursor: pointer;
        }

        button.btn-main {
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            cursor: pointer;
            padding: 10px;
            text-transform: uppercase;
        }

        button.btn-main:hover {
            background: var(--accent);
            color: #000;
        }

        .viewport-box {
            position: relative;
            height: 420px;
            background: #000;
            border: 2px solid var(--border);
        }

        #canvas3d { width: 100%; height: 100%; display: block; }

        .viewport-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
        }

        .stat-val { color: var(--accent); margin-top: 4px; }

        .cmd-out {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            height: 160px;
            overflow-y: auto;
            color: #22ff22;
            font-size: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .parts-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .toast {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            font-size: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 1000;
        }

        .toast.show { opacity: 1; }
        .toast.err { border-color: #ff3333; color: #ff3333; }
    </style>
</head>
<body>

    <header>
        <h1>MULTICRAFT 3D CONVERTER</h1>
    </header>

    <div class="layout">
        <!-- Настройки -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">1. Файл 3D-модели</div>
                <div class="field">
                    <label>Форматы: OBJ, GLB, GLTF, STL</label>
                    <input type="file" id="modelFile" accept=".obj,.glb,.gltf,.stl">
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">2. Выбор материалов</div>
                <div class="field">
                    <label>Форма блоков:</label>
                    <select id="shapeSelect">
                        <option value="full">Только цельные</option>
                        <option value="auto" selected>Автоопределение (Ступени/Плиты)</option>
                    </select>
                </div>

                <div class="field">
                    <label>Категория блоков:</label>
                    <select id="categorySelect">
                        <option value="all">Все (Цветные + Камень)</option>
                        <option value="color">Только цветные (Шерсть)</option>
                        <option value="stone">Только камень</option>
                    </select>
                </div>

                <div class="field">
                    <label>Формат команд WorldEdit:</label>
                    <select id="cmdMode">
                        <option value="short">Быстрые (/shift x/y/z, /s)</option>
                        <option value="standard">Стандартные (//pos1, //set)</option>
                    </select>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">3. Разделение команд</div>
                <div class="field">
                    <label>Лимит команд в 1 части:</label>
                    <select id="chunkSizeSelect">
                        <option value="50">50 команд</option>
                        <option value="100" selected>100 команд (Рекомендуется)</option>
                        <option value="200">200 команд</option>
                        <option value="500">500 команд</option>
                    </select>
                </div>

                <div class="field">
                    <div class="slider-row">
                        <span>Плотность сетки:</span>
                        <span id="resVal" class="val-tag">0.4</span>
                    </div>
                    <input type="range" id="resolution" min="0.1" max="1.0" step="0.05" value="0.4">
                </div>

                <div class="field">
                    <div class="slider-row">
                        <span>Масштаб:</span>
                        <span id="scaleVal" class="val-tag">1x</span>
                    </div>
                    <input type="range" id="scale" min="1" max="5" step="1" value="1">
                </div>

                <button class="btn-main" id="processBtn">Обработать модель</button>
            </div>
        </div>

        <!-- 3D Вьюпорт и Результат -->
        <div class="main-content">
            <div class="panel">
                <div class="panel-title">Просмотр модели</div>
                <div class="viewport-box">
                    <canvas id="canvas3d"></canvas>
                </div>
                
                <div class="viewport-controls">
                    <button id="toggleOrigBtn">Оригинал</button>
                    <button id="toggleVoxBtn">Блоки</button>
                    <button id="resetCamBtn">Сброс камеры</button>
                </div>

                <div class="field" style="margin-top: 10px;">
                    <div class="slider-row">
                        <span>Яркость:</span>
                        <span id="lightVal" class="val-tag">100%</span>
                    </div>
                    <input type="range" id="lightSlider" min="20" max="200" step="10" value="100">
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Статистика</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <label>Всего блоков</label>
                        <div class="stat-val" id="statCount">0</div>
                    </div>
                    <div class="stat-item">
                        <label>Всего частей</label>
                        <div class="stat-val" id="statParts">0</div>
                    </div>
                    <div class="stat-item">
                        <label>Режим</label>
                        <div class="stat-val" id="statMode">WorldEdit</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Команды по частям</div>
                
                <div class="parts-bar">
                    <label style="margin:0; width: auto;">Часть:</label>
                    <select id="partSelect" style="flex: 1;"></select>
                    <button class="btn-main" id="copyPartBtn" style="width: auto; padding: 6px 12px;">Скопировать часть</button>
                </div>

                <div class="cmd-out" id="cmdOutput">Загрузите модель и нажмите "Обработать"</div>
                
                <div class="viewport-controls" style="margin-top: 8px;">
                    <button id="downloadAllBtn">Скачать всё в .txt</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Подключение библиотеки Three.js и всех лоадеров -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

    <script>
    // Палитра блоков MultiCraft
    const PALETTE = [
        // Цветные шерсти
        { id: 'wool:white', rgb: [220, 220, 220], cat: 'color', name: 'white' },
        { id: 'wool:grey', rgb: [120, 120, 120], cat: 'color', name: 'grey' },
        { id: 'wool:dark_grey', rgb: [60, 60, 60], cat: 'color', name: 'dark_grey' },
        { id: 'wool:black', rgb: [20, 20, 20], cat: 'color', name: 'black' },
        { id: 'wool:red', rgb: [180, 30, 30], cat: 'color', name: 'red' },
        { id: 'wool:pink', rgb: [240, 130, 160], cat: 'color', name: 'pink' },
        { id: 'wool:orange', rgb: [230, 120, 20], cat: 'color', name: 'orange' },
        { id: 'wool:brown', rgb: [110, 60, 30], cat: 'color', name: 'brown' },
        { id: 'wool:yellow', rgb: [230, 200, 30], cat: 'color', name: 'yellow' },
        { id: 'wool:green', rgb: [40, 150, 40], cat: 'color', name: 'green' },
        { id: 'wool:dark_green', rgb: [20, 80, 20], cat: 'color', name: 'dark_green' },
        { id: 'wool:cyan', rgb: [30, 160, 180], cat: 'color', name: 'cyan' },
        { id: 'wool:blue', rgb: [30, 60, 180], cat: 'color', name: 'blue' },
        { id: 'wool:violet', rgb: [120, 40, 160], cat: 'color', name: 'violet' },
        { id: 'wool:magenta', rgb: [180, 50, 150], cat: 'color', name: 'magenta' },

        // Камень
        { id: 'default:stone', rgb: [128, 128, 128], cat: 'stone', name: 'stone' },
        { id: 'default:cobble', rgb: [90, 90, 90], cat: 'stone', name: 'cobble' },
        { id: 'default:brick', rgb: [150, 60, 40], cat: 'stone', name: 'brick' },
        { id: 'default:sandstone', rgb: [210, 190, 130], cat: 'stone', name: 'sandstone' },
        { id: 'default:desert_stone', rgb: [140, 90, 50], cat: 'stone', name: 'desert_stone' }
    ];

    function getNearestBlock(r, g, b, categoryFilter) {
        let bestMatch = PALETTE[0];
        let minDiff = Infinity;

        const filtered = PALETTE.filter(item => categoryFilter === 'all' || item.cat === categoryFilter);
        const list = filtered.length > 0 ? filtered : PALETTE;

        for (const block of list) {
            const diff = Math.sqrt(
                2 * Math.pow(r - block.rgb[0], 2) +
                4 * Math.pow(g - block.rgb[1], 2) +
                3 * Math.pow(b - block.rgb[2], 2)
            );
            if (diff < minDiff) {
                minDiff = diff;
                bestMatch = block;
            }
        }
        return bestMatch;
    }

    // Считывание текстуры
    const textureCanvasMap = new Map();
    function sampleTextureColor(texture, u, v) {
        if (!textureCanvasMap.has(texture.uuid)) {
            const img = texture.image;
            if (!img) return [128, 128, 128];
            const cvs = document.createElement('canvas');
            cvs.width = img.width || 64;
            cvs.height = img.height || 64;
            const ctx = cvs.getContext('2d');
            try {
                ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
                const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);
                textureCanvasMap.set(texture.uuid, { width: cvs.width, height: cvs.height, data: imgData.data });
            } catch(e) {
                return [128, 128, 128];
            }
        }
        const cache = textureCanvasMap.get(texture.uuid);
        if (!cache) return [128, 128, 128];

        u = u - Math.floor(u);
        v = v - Math.floor(v);
        const x = Math.floor(u * cache.width);
        const y = Math.floor((1 - v) * cache.height);
        const idx = (y * cache.width + x) * 4;
        return [cache.data[idx], cache.data[idx + 1], cache.data[idx + 2]];
    }

    // 3D Движок
    let scene, camera, renderer, controls;
    let loadedMesh = null, voxMesh = null;
    let commandChunks = [];

    function init3D() {
        const canvas = document.getElementById('canvas3d');
        const box = canvas.parentElement;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 1000);
        camera.position.set(3, 3, 5);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(box.clientWidth, box.clientHeight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
        ambLight.name = 'ambLight';
        scene.add(ambLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        function loop() {
            requestAnimationFrame(loop);
            controls.update();
            renderer.render(scene, camera);
        }
        loop();
    }

    function loadFile(file) {
        if (!file) return;
        showToast('Загрузка файла...');

        const url = URL.createObjectURL(file);
        const ext = file.name.split('.').pop().toLowerCase();

        const onSuccess = (obj) => {
            URL.revokeObjectURL(url);
            setupSceneModel(obj);
            showToast('Файл успешно загружен');
        };

        const onError = () => {
            URL.revokeObjectURL(url);
            showToast('Ошибка чтения 3D файла', true);
        };

        if (ext === 'obj') new THREE.OBJLoader().load(url, onSuccess, null, onError);
        else if (ext === 'glb' || ext === 'gltf') new THREE.GLTFLoader().load(url, g => onSuccess(g.scene), null, onError);
        else if (ext === 'stl') new THREE.STLLoader().load(url, geom => {
            geom.center();
            onSuccess(new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x888888 })));
        }, null, onError);
    }

    function setupSceneModel(model) {
        if (loadedMesh) scene.remove(loadedMesh);
        if (voxMesh) scene.remove(voxMesh);

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) model.scale.multiplyScalar(3 / maxDim);

        loadedMesh = model;
        scene.add(loadedMesh);

        camera.position.set(3, 3, 5);
        controls.target.set(0, 0, 0);
        controls.update();
    }

    // Детекция соседних блоков для определения ступеней и плит
    function resolveBlockShape(voxelSet, x, y, z, matchedBlock, shapeMode) {
        if (shapeMode !== 'auto') return matchedBlock.id;

        const hasDown = voxelSet.has(`${x},${y-1},${z}`);
        const hasUp = voxelSet.has(`${x},${y+1},${z}`);
        const hasNorth = voxelSet.has(`${x},${y},${z+1}`);
        const hasSouth = voxelSet.has(`${x},${y},${z-1}`);
        const hasEast = voxelSet.has(`${x+1},${y},${z}`);
        const hasWest = voxelSet.has(`${x-1},${y},${z}`);

        // Плиты
        if (hasDown && !hasUp && !hasNorth && !hasSouth && !hasEast && !hasWest) {
            return `stairs:slab_${matchedBlock.name}`;
        }

        // Ступеньки
        if (hasDown && !hasUp) {
            const sideEmpty = !hasNorth || !hasSouth || !hasEast || !hasWest;
            if (sideEmpty) {
                return `stairs:stair_${matchedBlock.name}`;
            }
        }

        return matchedBlock.id;
    }

    // Вокселизация
    function processVoxelization() {
        if (!loadedMesh) {
            showToast('Загрузите 3D-модель', true);
            return;
        }

        const step = parseFloat(document.getElementById('resolution').value);
        const scale = parseInt(document.getElementById('scale').value);
        const cat = document.getElementById('categorySelect').value;
        const shapeMode = document.getElementById('shapeSelect').value;

        const voxelMap = new Map();

        loadedMesh.traverse((child) => {
            if (child.isMesh && child.geometry) {
                const geom = child.geometry;
                const posAttr = geom.attributes.position;
                const uvAttr = geom.attributes.uv;
                const colorAttr = geom.attributes.color;
                const mat = Array.isArray(child.material) ? child.material[0] : child.material;

                for (let i = 0; i < posAttr.count; i++) {
                    const vx = posAttr.getX(i);
                    const vy = posAttr.getY(i);
                    const vz = posAttr.getZ(i);

                    let rgb = [128, 128, 128];
                    if (colorAttr) {
                        rgb = [
                            Math.round(colorAttr.getX(i) * 255),
                            Math.round(colorAttr.getY(i) * 255),
                            Math.round(colorAttr.getZ(i) * 255)
                        ];
                    } else if (mat && mat.map && mat.map.image && uvAttr) {
                        rgb = sampleTextureColor(mat.map, uvAttr.getX(i), uvAttr.getY(i));
                    } else if (mat && mat.color && (mat.color.r !== 1 || mat.color.g !== 1 || mat.color.b !== 1)) {
                        rgb = [
                            Math.round(mat.color.r * 255),
                            Math.round(mat.color.g * 255),
                            Math.round(mat.color.b * 255)
                        ];
                    }

                    const x = Math.round((vx * scale) / step);
                    const y = Math.round((vy * scale) / step);
                    const z = Math.round((vz * scale) / step);

                    const key = `${x},${y},${z}`;
                    if (!voxelMap.has(key)) {
                        const matched = getNearestBlock(rgb[0], rgb[1], rgb[2], cat);
                        voxelMap.set(key, { x, y, z, matched, rgb: matched.rgb });
                    }
                }
            }
        });

        const voxelSet = new Set(voxelMap.keys());
        const voxels = [];

        voxelMap.forEach((v, key) => {
            const finalBlockId = resolveBlockShape(voxelSet, v.x, v.y, v.z, v.matched, shapeMode);
            voxels.push({ x: v.x, y: v.y, z: v.z, blockId: finalBlockId, rgb: v.rgb });
        });

        renderVoxelPreview(voxels);
        generateCommandChunks(voxels);

        document.getElementById('statCount').textContent = voxels.length;
        showToast('Готово!');
    }

    function renderVoxelPreview(voxels) {
        if (voxMesh) scene.remove(voxMesh);

        const geom = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];

        voxels.forEach(v => {
            positions.push(v.x * 0.08, v.y * 0.08, v.z * 0.08);
            colors.push(v.rgb[0] / 255, v.rgb[1] / 255, v.rgb[2] / 255);
        });

        geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({ size: 0.12, vertexColors: true });
        voxMesh = new THREE.Points(geom, mat);
        scene.add(voxMesh);
    }

    function generateCommandChunks(voxels) {
        if (!voxels.length) return;

        const mode = document.getElementById('cmdMode').value;
        const chunkSize = parseInt(document.getElementById('chunkSizeSelect').value);
        let allLines = [];

        if (mode === 'short') {
            allLines.push('/1');
            let cx = 0, cy = 0, cz = 0;
            voxels.forEach(v => {
                if (v.x !== cx) { allLines.push(`/shift x ${v.x - cx}`); cx = v.x; }
                if (v.y !== cy) { allLines.push(`/shift y ${v.y - cy}`); cy = v.y; }
                if (v.z !== cz) { allLines.push(`/shift z ${v.z - cz}`); cz = v.z; }
                allLines.push(`/s ${v.blockId}`);
            });
        } else {
            voxels.forEach(v => {
                allLines.push(`//pos1 ${v.x},${v.y},${v.z}`);
                allLines.push(`//pos2 ${v.x},${v.y},${v.z}`);
                allLines.push(`//set ${v.blockId}`);
            });
        }

        commandChunks = [];
        for (let i = 0; i < allLines.length; i += chunkSize) {
            commandChunks.push(allLines.slice(i, i + chunkSize).join('\n'));
        }

        const partSelect = document.getElementById('partSelect');
        partSelect.innerHTML = '';
        commandChunks.forEach((_, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `Часть ${idx + 1} из ${commandChunks.length}`;
            partSelect.appendChild(opt);
        });

        document.getElementById('statParts').textContent = commandChunks.length;
        updateActiveChunkView();
    }

    function updateActiveChunkView() {
        const idx = parseInt(document.getElementById('partSelect').value) || 0;
        if (commandChunks[idx]) {
            document.getElementById('cmdOutput').textContent = commandChunks[idx];
        }
    }

    function showToast(text, isErr) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.toggle('err', !!isErr);
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Слушатели событий UI
    document.getElementById('resolution').addEventListener('input', e => document.getElementById('resVal').textContent = e.target.value);
    document.getElementById('scale').addEventListener('input', e => document.getElementById('scaleVal').textContent = e.target.value + 'x');
    document.getElementById('lightSlider').addEventListener('input', e => {
        const val = e.target.value;
        document.getElementById('lightVal').textContent = val + '%';
        const amb = scene.getObjectByName('ambLight');
        if (amb) amb.intensity = (val / 100) * 0.8;
    });

    document.getElementById('modelFile').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
    document.getElementById('processBtn').addEventListener('click', processVoxelization);
    document.getElementById('partSelect').addEventListener('change', updateActiveChunkView);

    document.getElementById('toggleOrigBtn').addEventListener('click', () => { if (loadedMesh) loadedMesh.visible = !loadedMesh.visible; });
    document.getElementById('toggleVoxBtn').addEventListener('click', () => { if (voxMesh) voxMesh.visible = !voxMesh.visible; });
    document.getElementById('resetCamBtn').addEventListener('click', () => { camera.position.set(3, 3, 5); controls.target.set(0, 0, 0); });

    document.getElementById('copyPartBtn').addEventListener('click', () => {
        const txt = document.getElementById('cmdOutput').textContent;
        navigator.clipboard.writeText(txt).then(() => showToast('Часть скопирована в буфер!'));
    });

    document.getElementById('downloadAllBtn').addEventListener('click', () => {
        const fullText = commandChunks.join('\n\n--- СЛЕДУЮЩАЯ ЧАСТЬ ---\n\n');
        const blob = new Blob([fullText], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'multicraft_full_build.txt';
        a.click();
    });

    window.addEventListener('DOMContentLoaded', init3D);
    </script>
</body>
</html>
