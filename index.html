<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCraft 3D Converter</title>
    <style>
        @font-face {
            font-family: 'MultiCraftFont';
            src: url('fonts/MultiCraftFont.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --bg: #080808;
            --panel: #111111;
            --border: #222222;
            --accent: #00ff41;
            --text-main: #dddddd;
            --text-muted: #666666;
            --font-custom: 'MultiCraftFont', 'Courier New', monospace;
            --font-main: 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 13px;
            line-height: 1.4;
            min-height: 100vh;
        }

        header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-family: var(--font-custom);
            font-size: 14px;
            color: var(--accent);
            font-weight: normal;
            letter-spacing: 1px;
        }

        .version {
            color: var(--text-muted);
            font-size: 11px;
        }

        .nav {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .nav-btn {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            padding: 12px;
            font-family: var(--font-main);
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        .nav-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(0, 255, 65, 0.02);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .box {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 16px;
            margin-bottom: 16px;
        }

        .box-title {
            font-family: var(--font-custom);
            font-size: 12px;
            color: var(--text-main);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-size: 11px;
        }

        input[type="file"], select, input[type="range"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            font-family: var(--font-main);
            font-size: 12px;
            outline: none;
            margin-bottom: 12px;
        }

        input[type="range"] {
            padding: 0;
            height: 20px;
            accent-color: var(--accent);
        }

        .val {
            color: var(--accent);
            float: right;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        button.btn {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px;
            font-family: var(--font-main);
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        button.btn:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.btn-main {
            border-color: var(--accent);
            color: var(--accent);
        }

        button.btn-main:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
        }

        button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        #canvas3d {
            width: 100%;
            height: 400px;
            background: var(--bg);
            border: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
        }

        .stat-num {
            font-size: 14px;
            color: var(--accent);
            margin-top: 4px;
        }

        .commands-list {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 11px;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 14px;
            font-size: 11px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.err {
            border-color: #ff4444;
            color: #ff4444;
        }

        .progress {
            height: 2px;
            background: var(--border);
            width: 100%;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>

    <header>
        <h1>MULTICRAFT VOXELIZER</h1>
        <span class="version">v2.0</span>
    </header>

    <div class="nav">
        <button id="tab1Btn" class="nav-btn active">1. ЗАГРУЗКА</button>
        <button id="tab2Btn" class="nav-btn" disabled>2. ПРОСМОТР</button>
        <button id="tab3Btn" class="nav-btn" disabled>3. КОМАНДЫ</button>
    </div>

    <main>
        <div id="tab1" class="tab-panel active">
            <div class="box">
                <div class="box-title">Файл модели</div>
                <label>Форматы: OBJ, GLB, GLTF, STL</label>
                <input type="file" id="modelFile" accept=".obj,.glb,.gltf,.stl" />
            </div>

            <div class="box">
                <div class="box-title">Настройки конвертации</div>
                
                <label>Детализация <span class="val" id="resVal">0.5</span></label>
                <input type="range" id="resolution" min="0.1" max="1.0" step="0.05" value="0.5" />

                <label>Размер <span class="val" id="scaleVal">1</span></label>
                <input type="range" id="scale" min="1" max="5" step="1" value="1" />

                <label>Режим команд</label>
                <select id="cmdMode">
                    <option value="short">Быстрые команды (/shift, /s)</option>
                    <option value="standard">Стандартные (//pos, //set)</option>
                </select>
            </div>

            <div class="box">
                <button class="btn btn-main" id="startBtn">Обработать модель</button>
                <div class="progress"><div class="progress-bar" id="pBar"></div></div>
            </div>
        </div>

        <div id="tab2" class="tab-panel">
            <div class="box">
                <div class="box-title">Окно просмотра</div>
                <div id="canvas3d"></div>
                <div class="btn-group">
                    <button class="btn" id="btnShowOrig">Исходник</button>
                    <button class="btn" id="btnShowVox">Блоки</button>
                    <button class="btn" id="btnResetCam">Сброс камеры</button>
                </div>
            </div>

            <div class="box">
                <div class="box-title">Информация</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <label>Всего блоков</label>
                        <div class="stat-num" id="countBlocks">0</div>
                    </div>
                    <div class="stat-card">
                        <label>Ширина</label>
                        <div class="stat-num" id="sizeX">0</div>
                    </div>
                    <div class="stat-card">
                        <label>Высота</label>
                        <div class="stat-num" id="sizeY">0</div>
                    </div>
                </div>
            </div>

            <div class="box">
                <button class="btn btn-main" id="toTab3Btn">Перейти к командам</button>
            </div>
        </div>

        <div id="tab3" class="tab-panel">
            <div class="box">
                <div class="box-title">Готовые команды</div>
                <div class="commands-list" id="cmdList">Команды еще не созданы</div>
                <div class="btn-group">
                    <button class="btn btn-main" id="copyBtn">Копировать текст</button>
                    <button class="btn" id="downloadBtn">Скачать файл .txt</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

    <script>
    const BLOCK_PALETTE = {
        'default:stone': [128, 128, 128],
        'default:cobble': [100, 100, 100],
        'default:brick': [160, 70, 50],
        'default:sand': [220, 200, 140],
        'default:dirt': [100, 70, 40],
        'default:wood': [110, 80, 40],
        'default:glass': [200, 220, 230],
        'wool:white': [240, 240, 240],
        'wool:black': [20, 20, 20],
        'wool:red': [200, 40, 40],
        'wool:green': [40, 160, 40],
        'wool:blue': [40, 60, 200],
        'wool:yellow': [230, 200, 40],
        'wool:orange': [230, 120, 30]
    };

    function findClosestBlock(r, g, b) {
        let selected = 'default:stone';
        let minDiff = Infinity;

        for (const [id, rgb] of Object.entries(BLOCK_PALETTE)) {
            const diff = Math.sqrt(
                Math.pow(r - rgb[0], 2) +
                Math.pow(g - rgb[1], 2) +
                Math.pow(b - rgb[2], 2)
            );
            if (diff < minDiff) {
                minDiff = diff;
                selected = id;
            }
        }
        return selected;
    }

    let scene, camera, renderer, controls;
    let mainMesh = null, voxelMesh = null;
    let convertedData = null;

    function initEngine() {
        const target = document.getElementById('canvas3d');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080808);

        camera = new THREE.PerspectiveCamera(60, target.clientWidth / target.clientHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(target.clientWidth, target.clientHeight);
        target.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);

        const light1 = new THREE.AmbientLight(0xffffff, 0.7);
        const light2 = new THREE.DirectionalLight(0xffffff, 0.5);
        light2.position.set(5, 10, 5);
        scene.add(light1, light2);

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            controls.update();
            renderer.render(scene, camera);
        }
        renderLoop();
    }

    function openFile(file) {
        if (!file) return;
        msg('Чтение файла...');

        const url = URL.createObjectURL(file);
        const ext = file.name.split('.').pop().toLowerCase();

        const done = (obj) => {
            URL.revokeObjectURL(url);
            displayModel(obj);
            msg('Файл загружен');
            document.getElementById('tab2Btn').disabled = false;
        };

        const fail = (err) => {
            URL.revokeObjectURL(url);
            msg('Ошибка чтения файла', true);
            console.error(err);
        };

        if (ext === 'obj') new THREE.OBJLoader().load(url, done, null, fail);
        else if (ext === 'glb' || ext === 'gltf') new THREE.GLTFLoader().load(url, g => done(g.scene), null, fail);
        else if (ext === 'stl') new THREE.STLLoader().load(url, geom => {
            geom.center();
            done(new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x888888 })));
        }, null, fail);
        else msg('Формат не поддерживается', true);
    }

    function displayModel(object) {
        if (mainMesh) scene.remove(mainMesh);
        if (voxelMesh) scene.remove(voxelMesh);

        const box = new THREE.Box3().setFromObject(object);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        object.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) object.scale.multiplyScalar(3 / maxDim);

        mainMesh = object;
        scene.add(mainMesh);

        camera.position.set(0, 0, 5);
        controls.target.set(0, 0, 0);
        controls.update();
    }

    function processModel() {
        if (!mainMesh) {
            msg('Сначала загрузите модель', true);
            return;
        }

        setProgress(20);
        const step = parseFloat(document.getElementById('resolution').value);
        const scaleVal = parseInt(document.getElementById('scale').value);

        const blocksMap = new Map();

        mainMesh.traverse((child) => {
            if (child.isMesh && child.geometry) {
                let color = [128, 128, 128];
                if (child.material && child.material.color) {
                    color = [
                        Math.round(child.material.color.r * 255),
                        Math.round(child.material.color.g * 255),
                        Math.round(child.material.color.b * 255)
                    ];
                }

                const pos = child.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    const vx = Math.round((pos[i] * scaleVal) / step);
                    const vy = Math.round((pos[i+1] * scaleVal) / step);
                    const vz = Math.round((pos[i+2] * scaleVal) / step);

                    const key = `${vx},${vy},${vz}`;
                    if (!blocksMap.has(key)) {
                        blocksMap.set(key, findClosestBlock(color[0], color[1], color[2]));
                    }
                }
            }
        });

        setProgress(70);

        const blocksArray = [];
        blocksMap.forEach((blockId, key) => {
            const [x, y, z] = key.split(',').map(Number);
            blocksArray.push({ x, y, z, blockId });
        });

        convertedData = blocksArray;
        renderVoxels(blocksArray);

        document.getElementById('countBlocks').textContent = blocksArray.length;
        document.getElementById('tab3Btn').disabled = false;

        setProgress(100);
        msg('Обработка завершена');
        setTimeout(() => setProgress(0), 1000);
    }

    function renderVoxels(blocks) {
        if (voxelMesh) scene.remove(voxelMesh);

        const geom = new THREE.BufferGeometry();
        const positions = [];

        blocks.forEach(b => {
            const px = b.x * 0.1, py = b.y * 0.1, pz = b.z * 0.1;
            const s = 0.04;
            positions.push(
                px-s, py-s, pz-s,  px+s, py-s, pz-s,
                px+s, py+s, pz-s,  px-s, py+s, pz-s,
                px-s, py-s, pz+s,  px+s, py-s, pz+s
            );
        });

        geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
        const mat = new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true });
        voxelMesh = new THREE.Mesh(geom, mat);
        scene.add(voxelMesh);
    }

    function makeCommands() {
        if (!convertedData || convertedData.length === 0) return;

        const mode = document.getElementById('cmdMode').value;
        let lines = [];

        if (mode === 'short') {
            lines.push('/1');
            let cx = 0, cy = 0, cz = 0;
            convertedData.forEach(b => {
                if (b.x !== cx) { lines.push(`/shift x ${b.x - cx}`); cx = b.x; }
                if (b.y !== cy) { lines.push(`/shift y ${b.y - cy}`); cy = b.y; }
                if (b.z !== cz) { lines.push(`/shift z ${b.z - cz}`); cz = b.z; }
                lines.push(`/s ${b.blockId}`);
            });
        } else {
            convertedData.forEach(b => {
                lines.push(`//pos1 ${b.x},${b.y},${b.z}`);
                lines.push(`//pos2 ${b.x},${b.y},${b.z}`);
                lines.push(`//set ${b.blockId}`);
            });
        }

        const text = lines.join('\n');
        document.getElementById('cmdList').textContent = text;
    }

    function showTab(id) {
        document.querySelectorAll('.tab-panel').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById(id + 'Btn').classList.add('active');
    }

    function msg(text, isErr) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.toggle('err', !!isErr);
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    function setProgress(val) {
        document.getElementById('pBar').style.width = val + '%';
    }

    document.getElementById('resolution').addEventListener('input', e => document.getElementById('resVal').textContent = e.target.value);
    document.getElementById('scale').addEventListener('input', e => document.getElementById('scaleVal').textContent = e.target.value);

    document.getElementById('modelFile').addEventListener('change', e => { openFile(e.target.files[0]); e.target.value = ''; });
    document.getElementById('startBtn').addEventListener('click', () => { processModel(); showTab('tab2'); });
    document.getElementById('toTab3Btn').addEventListener('click', () => { makeCommands(); showTab('tab3'); });

    document.getElementById('tab1Btn').addEventListener('click', () => showTab('tab1'));
    document.getElementById('tab2Btn').addEventListener('click', () => showTab('tab2'));
    document.getElementById('tab3Btn').addEventListener('click', () => showTab('tab3'));

    document.getElementById('btnShowOrig').addEventListener('click', () => { if (mainMesh) mainMesh.visible = !mainMesh.visible; });
    document.getElementById('btnShowVox').addEventListener('click', () => { if (voxelMesh) voxelMesh.visible = !voxelMesh.visible; });
    document.getElementById('btnResetCam').addEventListener('click', () => { camera.position.set(0, 0, 5); controls.target.set(0, 0, 0); });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const text = document.getElementById('cmdList').textContent;
        navigator.clipboard.writeText(text).then(() => msg('Скопировано в буфер'));
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const text = document.getElementById('cmdList').textContent;
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'multicraft_commands.txt';
        a.click();
    });

    window.addEventListener('DOMContentLoaded', () => {
        initEngine();
    });
    </script>
</body>
</html>
