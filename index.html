<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCraft 3D Converter</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: 'MultiCraftFont';
            src: url('fonts/MultiCraftFont.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --border: #262626;
            --border-active: #00ff41;
            --accent: #00ff41;
            --text: #ffffff;
            --text-dim: #777777;
            --font-main: 'MultiCraftFont', 'Press Start 2P', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-size: 11px;
            line-height: 1.5;
            padding: 16px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 16px;
        }

        h1 {
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (max-width: 850px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--panel);
            border: 2px solid var(--border);
            padding: 14px;
            margin-bottom: 14px;
        }

        .panel-title {
            font-size: 10px;
            color: var(--accent);
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            color: var(--text-dim);
            font-size: 9px;
            margin-bottom: 6px;
        }

        select, input[type="file"], button {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            font-size: 9px;
            outline: none;
        }

        select:focus, button:hover {
            border-color: var(--border-active);
        }

        .slider-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-dim);
            font-size: 9px;
            margin-bottom: 4px;
        }

        .val-tag {
            color: var(--accent);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            cursor: pointer;
        }

        button.btn-main {
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            cursor: pointer;
            padding: 10px;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        button.btn-main:hover:not(:disabled) {
            background: var(--accent);
            color: #000;
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .viewport-box {
            position: relative;
            height: 480px;
            background: #000;
            border: 2px solid var(--border);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .viewport-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .stat-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 8px;
            text-align: center;
        }

        .stat-val {
            color: var(--accent);
            margin-top: 4px;
        }

        .cmd-out {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            color: var(--text-dim);
            font-size: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .toast {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px;
            font-size: 9px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .toast.show { opacity: 1; }
        .toast.err { border-color: #ff3333; color: #ff3333; }
    </style>
</head>
<body>

    <header>
        <h1>MULTICRAFT 3D CONVERTER</h1>
    </header>

    <div class="layout">
        <!-- Левая панель: Параметры -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">1. Файл 3D-модели</div>
                <div class="field">
                    <label>Форматы: OBJ, GLB, GLTF, STL</label>
                    <input type="file" id="modelFile" accept=".obj,.glb,.gltf,.stl">
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">2. Выбор блоков</div>
                
                <div class="field">
                    <label>Форма блоков:</label>
                    <select id="shapeSelect">
                        <option value="full">Только цельные</option>
                        <option value="cut">С нарезными (Плиты)</option>
                    </select>
                </div>

                <div class="field">
                    <label>Категория материалов:</label>
                    <select id="categorySelect">
                        <option value="all">Все блоки</option>
                        <option value="stone">Камень</option>
                        <option value="color">Разноцветные</option>
                    </select>
                </div>

                <div class="field">
                    <label>Режим команд:</label>
                    <select id="cmdMode">
                        <option value="short">Быстрые (/shift, /s)</option>
                        <option value="standard">Стандартные (//pos, //set)</option>
                    </select>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">3. Размеры и детальность</div>
                
                <div class="field">
                    <div class="slider-row">
                        <span>Детализация:</span>
                        <span id="resVal" class="val-tag">0.5</span>
                    </div>
                    <input type="range" id="resolution" min="0.1" max="1.0" step="0.05" value="0.5">
                </div>

                <div class="field">
                    <div class="slider-row">
                        <span>Масштаб:</span>
                        <span id="scaleVal" class="val-tag">1x</span>
                    </div>
                    <input type="range" id="scale" min="1" max="5" step="1" value="1">
                </div>

                <button class="btn-main" id="processBtn">Обработать модель</button>
            </div>
        </div>

        <!-- Правая панель: Просмотр и Результат -->
        <div class="main-content">
            <div class="panel">
                <div class="panel-title">Предварительный просмотр</div>
                <div class="viewport-box">
                    <canvas id="canvas3d"></canvas>
                </div>
                
                <div class="viewport-controls">
                    <button id="toggleOrigBtn">Оригинал</button>
                    <button id="toggleVoxBtn">Блоки</button>
                    <button id="resetCamBtn">Сброс камеры</button>
                </div>

                <div class="field" style="margin-top: 12px;">
                    <div class="slider-row">
                        <span>Яркость света:</span>
                        <span id="lightVal" class="val-tag">100%</span>
                    </div>
                    <input type="range" id="lightSlider" min="20" max="200" step="10" value="100">
                </div>

                <div class="field">
                    <div class="slider-row">
                        <span>Вращение:</span>
                        <span id="speedVal" class="val-tag">Выкл</span>
                    </div>
                    <input type="range" id="speedSlider" min="0" max="5" step="0.5" value="0">
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Статистика</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <label>Всего блоков</label>
                        <div class="stat-val" id="statCount">0</div>
                    </div>
                    <div class="stat-item">
                        <label>Ширина X</label>
                        <div class="stat-val" id="statX">0</div>
                    </div>
                    <div class="stat-item">
                        <label>Высота Y</label>
                        <div class="stat-val" id="statY">0</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Команды WorldEdit</div>
                <div class="cmd-out" id="cmdOutput">Загрузите модель и нажмите Обработать</div>
                <div class="viewport-controls" style="margin-top: 8px;">
                    <button class="btn-main" id="copyBtn">Скопировать текст</button>
                    <button id="downloadBtn">Скачать .txt</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

    <script>
    // Палитра блоков MultiCraft
    const PALETTE = [
        // Камень (Цельные)
        { id: 'default:stone', rgb: [128, 128, 128], cat: 'stone', shape: 'full' },
        { id: 'default:cobble', rgb: [100, 100, 100], cat: 'stone', shape: 'full' },
        { id: 'default:brick', rgb: [160, 70, 50], cat: 'stone', shape: 'full' },
        { id: 'default:sandstone', rgb: [220, 200, 140], cat: 'stone', shape: 'full' },
        { id: 'default:desert_stone', rgb: [150, 100, 60], cat: 'stone', shape: 'full' },
        
        // Камень (Нарезные)
        { id: 'stairs:slab_stone', rgb: [128, 128, 128], cat: 'stone', shape: 'cut' },
        { id: 'stairs:slab_cobble', rgb: [100, 100, 100], cat: 'stone', shape: 'cut' },
        { id: 'stairs:slab_brick', rgb: [160, 70, 50], cat: 'stone', shape: 'cut' },

        // Цветные (Цельные)
        { id: 'wool:white', rgb: [240, 240, 240], cat: 'color', shape: 'full' },
        { id: 'wool:black', rgb: [20, 20, 20], cat: 'color', shape: 'full' },
        { id: 'wool:red', rgb: [200, 40, 40], cat: 'color', shape: 'full' },
        { id: 'wool:green', rgb: [40, 160, 40], cat: 'color', shape: 'full' },
        { id: 'wool:blue', rgb: [40, 60, 200], cat: 'color', shape: 'full' },
        { id: 'wool:yellow', rgb: [240, 210, 40], cat: 'color', shape: 'full' },
        { id: 'wool:orange', rgb: [230, 120, 30], cat: 'color', shape: 'full' },
        { id: 'wool:violet', rgb: [130, 40, 180], cat: 'color', shape: 'full' },

        // Цветные (Нарезные)
        { id: 'stairs:slab_wool_white', rgb: [240, 240, 240], cat: 'color', shape: 'cut' },
        { id: 'stairs:slab_wool_red', rgb: [200, 40, 40], cat: 'color', shape: 'cut' },
        { id: 'stairs:slab_wool_blue', rgb: [40, 60, 200], cat: 'color', shape: 'cut' },
        { id: 'stairs:slab_wool_yellow', rgb: [240, 210, 40], cat: 'color', shape: 'cut' }
    ];

    function getNearestBlock(r, g, b, categoryFilter, shapeFilter) {
        let bestMatch = 'default:stone';
        let minDiff = Infinity;

        const filtered = PALETTE.filter(item => {
            const matchCat = (categoryFilter === 'all' || item.cat === categoryFilter);
            const matchShape = (shapeFilter === 'full' ? item.shape === 'full' : true);
            return matchCat && matchShape;
        });

        const list = filtered.length > 0 ? filtered : PALETTE;

        for (const block of list) {
            const diff = Math.sqrt(
                Math.pow(r - block.rgb[0], 2) +
                Math.pow(g - block.rgb[1], 2) +
                Math.pow(b - block.rgb[2], 2)
            );
            if (diff < minDiff) {
                minDiff = diff;
                bestMatch = block.id;
            }
        }
        return bestMatch;
    }

    // 3D Движок
    let scene, camera, renderer, controls;
    let loadedMesh = null, voxMesh = null;
    let convertedVoxels = [];

    function init3D() {
        const canvas = document.getElementById('canvas3d');
        const box = canvas.parentElement;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        camera = new THREE.PerspectiveCamera(45, box.clientWidth / box.clientHeight, 0.1, 1000);
        camera.position.set(3, 3, 5);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(box.clientWidth, box.clientHeight);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
        ambLight.name = 'ambLight';
        scene.add(ambLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        dirLight.name = 'dirLight';
        scene.add(dirLight);

        function loop() {
            requestAnimationFrame(loop);
            
            const speed = parseFloat(document.getElementById('speedSlider').value);
            if (speed > 0 && voxMesh) {
                voxMesh.rotation.y += speed * 0.01;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        loop();
    }

    function loadFile(file) {
        if (!file) return;
        showToast('Чтение файла...');

        const url = URL.createObjectURL(file);
        const ext = file.name.split('.').pop().toLowerCase();

        const onSuccess = (obj) => {
            URL.revokeObjectURL(url);
            setupSceneModel(obj);
            showToast('Файл загружен');
        };

        const onError = (err) => {
            URL.revokeObjectURL(url);
            showToast('Ошибка загрузки файла', true);
            console.error(err);
        };

        if (ext === 'obj') new THREE.OBJLoader().load(url, onSuccess, null, onError);
        else if (ext === 'glb' || ext === 'gltf') new THREE.GLTFLoader().load(url, g => onSuccess(g.scene), null, onError);
        else if (ext === 'stl') new THREE.STLLoader().load(url, geom => {
            geom.center();
            onSuccess(new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x888888 })));
        }, null, onError);
        else showToast('Неподдерживаемый формат', true);
    }

    function setupSceneModel(model) {
        if (loadedMesh) scene.remove(loadedMesh);
        if (voxMesh) scene.remove(voxMesh);

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        model.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) model.scale.multiplyScalar(3 / maxDim);

        loadedMesh = model;
        scene.add(loadedMesh);

        camera.position.set(3, 3, 5);
        controls.target.set(0, 0, 0);
        controls.update();
    }

    function processVoxelization() {
        if (!loadedMesh) {
            showToast('Загрузите 3D-модель', true);
            return;
        }

        const step = parseFloat(document.getElementById('resolution').value);
        const scale = parseInt(document.getElementById('scale').value);
        const cat = document.getElementById('categorySelect').value;
        const shape = document.getElementById('shapeSelect').value;

        const voxelMap = new Map();

        loadedMesh.traverse((child) => {
            if (child.isMesh && child.geometry) {
                let color = [128, 128, 128];
                if (child.material && child.material.color) {
                    color = [
                        Math.round(child.material.color.r * 255),
                        Math.round(child.material.color.g * 255),
                        Math.round(child.material.color.b * 255)
                    ];
                }

                const pos = child.geometry.attributes.position.array;
                for (let i = 0; i < pos.length; i += 3) {
                    const x = Math.round((pos[i] * scale) / step);
                    const y = Math.round((pos[i+1] * scale) / step);
                    const z = Math.round((pos[i+2] * scale) / step);

                    const key = `${x},${y},${z}`;
                    if (!voxelMap.has(key)) {
                        const blockId = getNearestBlock(color[0], color[1], color[2], cat, shape);
                        voxelMap.set(key, { x, y, z, blockId });
                    }
                }
            }
        });

        convertedVoxels = Array.from(voxelMap.values());
        renderVoxelPreview(convertedVoxels);
        generateCommands();

        document.getElementById('statCount').textContent = convertedVoxels.length;
        showToast('Конвертация завершена');
    }

    function renderVoxelPreview(voxels) {
        if (voxMesh) scene.remove(voxMesh);

        const geom = new THREE.BufferGeometry();
        const positions = [];

        voxels.forEach(v => {
            const px = v.x * 0.08, py = v.y * 0.08, pz = v.z * 0.08;
            const s = 0.035;
            positions.push(
                px-s, py-s, pz-s,  px+s, py-s, pz-s,
                px+s, py+s, pz-s,  px-s, py+s, pz-s,
                px-s, py-s, pz+s,  px+s, py-s, pz+s
            );
        });

        geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
        const mat = new THREE.MeshBasicMaterial({ color: 0x00ff41, wireframe: true });
        voxMesh = new THREE.Mesh(geom, mat);
        scene.add(voxMesh);
    }

    function generateCommands() {
        if (!convertedVoxels.length) return;

        const mode = document.getElementById('cmdMode').value;
        let lines = [];

        if (mode === 'short') {
            lines.push('/1');
            let cx = 0, cy = 0, cz = 0;
            convertedVoxels.forEach(v => {
                if (v.x !== cx) { lines.push(`/shift x ${v.x - cx}`); cx = v.x; }
                if (v.y !== cy) { lines.push(`/shift y ${v.y - cy}`); cy = v.y; }
                if (v.z !== cz) { lines.push(`/shift z ${v.z - cz}`); cz = v.z; }
                lines.push(`/s ${v.blockId}`);
            });
        } else {
            convertedVoxels.forEach(v => {
                lines.push(`//pos1 ${v.x},${v.y},${v.z}`);
                lines.push(`//pos2 ${v.x},${v.y},${v.z}`);
                lines.push(`//set ${v.blockId}`);
            });
        }

        document.getElementById('cmdOutput').textContent = lines.join('\n');
    }

    function showToast(text, isErr) {
        const t = document.getElementById('toast');
        t.textContent = text;
        t.classList.toggle('err', !!isErr);
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Слушатели событий
    document.getElementById('resolution').addEventListener('input', e => document.getElementById('resVal').textContent = e.target.value);
    document.getElementById('scale').addEventListener('input', e => document.getElementById('scaleVal').textContent = e.target.value + 'x');

    document.getElementById('lightSlider').addEventListener('input', e => {
        const val = e.target.value;
        document.getElementById('lightVal').textContent = val + '%';
        const amb = scene.getObjectByName('ambLight');
        if (amb) amb.intensity = (val / 100) * 0.8;
    });

    document.getElementById('speedSlider').addEventListener('input', e => {
        const val = e.target.value;
        document.getElementById('speedVal').textContent = val == 0 ? 'Выкл' : val;
    });

    document.getElementById('modelFile').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
    document.getElementById('processBtn').addEventListener('click', processVoxelization);

    document.getElementById('toggleOrigBtn').addEventListener('click', () => { if (loadedMesh) loadedMesh.visible = !loadedMesh.visible; });
    document.getElementById('toggleVoxBtn').addEventListener('click', () => { if (voxMesh) voxMesh.visible = !voxMesh.visible; });
    document.getElementById('resetCamBtn').addEventListener('click', () => { camera.position.set(3, 3, 5); controls.target.set(0, 0, 0); });

    document.getElementById('copyBtn').addEventListener('click', () => {
        const txt = document.getElementById('cmdOutput').textContent;
        navigator.clipboard.writeText(txt).then(() => showToast('Скопировано в буфер'));
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const txt = document.getElementById('cmdOutput').textContent;
        const blob = new Blob([txt], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'multicraft_build.txt';
        a.click();
    });

    window.addEventListener('DOMContentLoaded', () => {
        init3D();
    });
    </script>
</body>
</html>
